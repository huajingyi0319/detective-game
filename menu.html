<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>乾陵残卷 - 章节选择</title>
  <style>
    body {
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
        font-size: 36px;
        color: #d4af37;
        margin-bottom: 40px;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }
    .chapter-btn {
      margin: 10px;
      padding: 15px 30px;
      background: #d4af37;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      width: 280px;
    }
    .chapter-btn:disabled {
      background: #666;
      cursor: not-allowed;
      color: #999;
    }
    .tip {
        margin-top: 20px;
        color: #aaa;
        font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>乾陵残卷</h1>
  <button class="chapter-btn" id="ch1Btn">第一章：乾陵凶案（已解锁）</button>
  <button class="chapter-btn" id="ch2Btn" disabled>第二章：深宫秘影（未解锁）</button>
  <button class="chapter-btn" id="ch3Btn" disabled>第三章：真相落定（未解锁）</button>
  <div class="tip" id="tipTxt">集齐第一章线索解锁后续章节</div>

  <script>
    const saveKey = "qianling_save";
    const totalCh1 = 5;
    const totalCh2 = 10;

    window.onload = () => {
      let collected = [];
      const saved = localStorage.getItem(saveKey);
      if(saved){
        try{
          const data = JSON.parse(saved);
          collected = data.collected || [];
        }catch(e){}
      }

      const ch1Done = collected.filter(x=>parseInt(x)<=totalCh1).length >= totalCh1;
      const ch2Done = collected.length >= totalCh2;

      if(ch1Done){
        document.getElementById('ch2Btn').disabled = false;
      }
      if(ch2Done){
        document.getElementById('ch3Btn').disabled = false;
        document.getElementById('tipTxt').innerText = "全部章节已解锁，可探索完整结局";
      }

      document.getElementById('ch1Btn').onclick = ()=>location.href='index.html';
      document.getElementById('ch2Btn').onclick = ()=>location.href='chapter2.html';
      document.getElementById('ch3Btn').onclick = ()=>location.href='chapter3.html';
    };
  </script>
</body>
</html>
