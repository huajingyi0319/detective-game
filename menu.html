<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乾陵残卷・鎏金钥谜案 - 章节菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", serif;
        }
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: url('bg-menu.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-blend-mode: overlay;
        }
        .title {
            font-size: 42px;
            color: #d4af37;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(212,175,55,0.7);
            letter-spacing: 6px;
            text-align: center;
        }
        .subtitle {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 60px;
            letter-spacing: 2px;
            text-align: center;
            max-width: 600px;
            line-height: 1.8;
        }
        .menu-wrap {
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: rgba(26,26,46,0.8);
            padding: 30px 40px;
            border-radius: 12px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .menu-btn {
            width: 280px;
            padding: 16px 0;
            font-size: 18px;
            border: 2px solid #d4af37;
            background: transparent;
            color: #d4af37;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .menu-btn:hover {
            background: #d4af37;
            color: #1a1a2e;
            transform: translateY(-3px);
        }
        .menu-btn.lock {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: #666;
            color: #999;
        }
        .menu-btn.lock:hover {
            background: transparent;
            color: #999;
            transform: none;
        }
        .reset-btn {
            margin-top: 25px;
            background: rgba(58,58,85,0.6);
            border-color: #666;
            color: #eee;
        }
        .reset-btn:hover {
            background: #3a3a5a;
            color: #fff;
            border-color: #888;
        }
        /* BGM控制按钮 */
        .bgm-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(212,175,55,0.8);
            color: #1a1a2e;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        @media screen and (max-width: 768px) {
            .title { font-size: 28px; letter-spacing: 4px; }
            .subtitle { font-size: 14px; margin-bottom: 40px; padding: 0 20px; }
            .menu-wrap { padding: 20px 25px; gap: 14px; }
            .menu-btn { width: 220px; padding: 14px 0; font-size: 16px; }
            .reset-btn { margin-top: 20px; }
            .bgm-btn { width: 36px; height: 36px; font-size: 16px; right: 15px; top: 15px; }
        }

        @media screen and (orientation: portrait) and (max-width: 480px) {
            .title { font-size: 18px; letter-spacing: 2px; }
            .subtitle { font-size: 12px; margin-bottom: 25px; line-height: 1.5; }
            .menu-wrap { padding: 12px 15px; gap: 10px; width: 92%; }
            .menu-btn { padding: 10px 0; font-size: 14px; }
            .bgm-btn { width: 28px; height: 28px; font-size: 12px; right: 8px; top: 8px; }
        }
    </style>
</head>
<body>
    <h1 class="title">乾陵残卷・鎏金钥谜案</h1>
    <p class="subtitle">唐神龙元年・乾陵封藏前夕，鎏金鸳鸯钥失窃，将作大匠离奇身亡，密闭陵监署内，真凶藏于五人之中——你，大理寺少卿，需在三个时辰内，破谜寻凶，守护李唐龙脉</p>
    
    <div class="menu-wrap">
        <button class="menu-btn" id="ch1">第一章 陵监惊变</button>
        <button class="menu-btn lock" id="ch2" disabled>第二章 秘影丛生（未解锁）</button>
        <button class="menu-btn lock" id="ch3" disabled>第三章 真相昭雪（未解锁）</button>
        <button class="menu-btn reset-btn" id="resetBtn">重置全部存档</button>
    </div>

    <!-- BGM控制按钮 -->
    <button class="bgm-btn" id="bgmBtn" onclick="toggleBgm()">▶</button>
    <audio id="bgm" loop preload="metadata">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        const saveKey = "qianling_save";
        const ch1 = document.getElementById('ch1');
        const ch2 = document.getElementById('ch2');
        const ch3 = document.getElementById('ch3');
        const bgm = document.getElementById('bgm');
        const bgmBtn = document.getElementById('bgmBtn');
        let bgmPlaying = false;

        let collected = new Set();

        // BGM控制
        function toggleBgm() {
            if (bgmPlaying) {
                bgm.pause();
                bgmBtn.innerText = "▶";
            } else {
                bgm.play().catch(() => {});
                bgm.volume = 0.3;
                bgmBtn.innerText = "⏸";
            }
            bgmPlaying = !bgmPlaying;
        }

        // 读取存档
        function loadSave(){
            let s = localStorage.getItem(saveKey);
            if(!s) return;
            try{
                let d = JSON.parse(s);
                collected = new Set(d.collected || []);
            }catch(e){}
        }

        // 判断解锁
        function checkUnlock(){
            let num = collected.size;

            // 第一章永远可进
            ch1.onclick = ()=>{
                toggleBgm(); // 进入游戏自动播放BGM
                location.href="index.html";
            };

            // 线索 >=5 解锁第二章
            if(num >= 5){
                ch2.classList.remove('lock');
                ch2.disabled = false;
                ch2.innerText = "第二章 秘影丛生";
                ch2.onclick = ()=>{
                    toggleBgm();
                    location.href="chapter2.html";
                };
            }

            // 线索 >=10 解锁第三章
            if(num >= 10){
                ch3.classList.remove('lock');
                ch3.disabled = false;
                ch3.innerText = "第三章 真相昭雪";
                ch3.onclick = ()=>{
                    toggleBgm();
                    location.href="chapter3.html";
                };
            }
        }

        // 重置存档
        document.getElementById('resetBtn').onclick = function(){
            if(confirm("确定要重置全部游戏进度吗？将清空所有线索，恢复初始状态！")){
                localStorage.removeItem(saveKey);
                bgm.pause();
                bgmPlaying = false;
                bgmBtn.innerText = "▶";
                alert("存档已重置，请刷新页面重新开始");
                location.reload();
            }
        }

        // 页面加载完成后执行
        window.onload = function(){
            loadSave();
            checkUnlock();
        }
    </script>
</body>
</html>
